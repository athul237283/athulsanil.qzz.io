<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Athul</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --ink: #1a1814;
      --muted: #888076;
      --accent: #c8a96e;
      --card: #efecea;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .container {
      max-width: 560px;
      width: 100%;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: slideUp 0.8s ease 0.2s forwards;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3rem, 10vw, 5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: slideUp 0.8s ease 0.35s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--muted);
    }

    .bio {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--muted);
      max-width: 420px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: slideUp 0.8s ease 0.5s forwards;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: slideUp 0.8s ease 0.6s forwards;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      opacity: 0;
      animation: slideUp 0.8s ease 0.7s forwards;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      border-radius: 100px;
      background: var(--card);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      border: 1px solid transparent;
    }

    .links a:hover {
      background: var(--ink);
      color: var(--bg);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 4rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: slideUp 0.8s ease 0.9s forwards;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">Hello, world</p>
    <h1>I'm <em>Athul.</em></h1>
    <p class="bio">
      A curious person on the internet. I like building things, exploring ideas, and figuring out how stuff works — one domain at a time.
    </p>
    <div class="divider"></div>
    <div class="links">

        GitHub
      </a>
      <a href="https://twitter.com" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

      <a href="mailto:athul@example.com">

    </div>

  </div>
</body>
</html>
